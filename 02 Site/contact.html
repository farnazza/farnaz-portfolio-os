        <h1 class="page-title cform__title" id="cp-title">Have an idea or a problem to untangle? Say hello.</h1>
        <!-- Formspree: replace YOUR_FORM_ID with your form's ID (formspree.io, your form, Integration). The same form is in index.html and contact.html. -->
        <form class="cform" data-cform method="POST" action="https://formspree.io/f/YOUR_FORM_ID" aria-labelledby="cp-title">
          <input type="hidden" name="_subject" value="New message from portfolio">
          <div class="cform__hp" aria-hidden="true"><label>Leave this empty <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
          <div class="cform__field">
            <label for="cp-name">Name</label>
            <input id="cp-name" name="name" type="text" autocomplete="name" required aria-describedby="cp-name-err">
            <p class="cform__err" id="cp-name-err" hidden></p>
          </div>
          <div class="cform__field">
            <label for="cp-email">Email</label>
            <input id="cp-email" name="email" type="email" autocomplete="email" required aria-describedby="cp-email-err">
            <p class="cform__err" id="cp-email-err" hidden></p>
          </div>
          <div class="cform__field">
            <label for="cp-message">Message</label>
            <textarea id="cp-message" name="message" rows="6" required aria-describedby="cp-message-err"></textarea>
            <p class="cform__err" id="cp-message-err" hidden></p>
          </div>
          <div class="cform__actions">
            <button class="cta cta--dark cform__send" type="submit"><span class="cta__label">Send message</span></button>
            <p class="cform__fail" role="alert" hidden></p>
          </div>
        </form>
        <p class="cform__done" tabindex="-1" aria-live="polite" hidden>Thanks, your message is on its way. I’ll get back to you soon.</p>
